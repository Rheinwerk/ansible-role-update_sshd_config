---
- name: Assert _sshd_krl and _sshd_principals are mappings
  ansible.builtin.assert:
    that:
      - _sshd_krl is mapping
      - _sshd_principals is mapping
    fail_msg: "_sshd_krl and _sshd_principals must be mappings, {} skips that part of the role"
    quiet: true
  tags:
    - always

# The command runs as argv and ExecStart quotes every argument, but a newline would end the
# ExecStart line, so control characters are rejected. filename also ends up unquoted as RevokedKeys
# in sshd_config. \Z, not $: Python's $ also matches before a trailing newline.
- name: Assert _sshd_krl sets every key, absolute paths and no control characters
  ansible.builtin.assert:
    that:
      - _sshd_krl_required_keys | difference(_sshd_krl.keys()) | length == 0
      - _sshd_krl_required_keys | map('extract', _sshd_krl) | reject('string') | list | length == 0
      - _sshd_krl.s3_key is match('^[^\\x00-\\x1f\\x7f]+\\Z')
      - _sshd_krl.filename is match('^/\\S+\\Z')
      - _sshd_krl.update_command is match('^/[^\\x00-\\x1f\\x7f]+\\Z')
      - _sshd_krl.on_calendar | length > 0
    fail_msg: >-
      _sshd_krl must set {{ _sshd_krl_required_keys | join(', ') }} as strings; filename and update_command
      absolute paths, filename without whitespace, s3_key and update_command without control characters,
      on_calendar not empty
    quiet: true
  when:
    - _sshd_krl | length > 0
  tags:
    - always

- name: Assert _sshd_principals sets a file name and maps users to lists of principals
  ansible.builtin.assert:
    that:
      - _sshd_principals_required_keys | difference(_sshd_principals.keys()) | length == 0
      - _sshd_principals.filename_pattern is string
      # \Z, not $: Python's $ also matches before a trailing newline, which would end up in a file name
      - _sshd_principals.filename_pattern is match('^[^%/\\s]*%u[^%/\\s]*\\Z')
      - _sshd_principals.mappings is mapping
      - _sshd_principals.mappings | length > 0
      - _sshd_principals.mappings.keys() | reject('match', '^[a-z_][a-z0-9_-]*\\Z') | list | length == 0
      - _sshd_principals.mappings.values() | reject('sequence') | list | length == 0
      - _sshd_principals.mappings.values() | select('string') | list | length == 0
      - _sshd_principals.mappings.values() | map('reject', 'string') | map('list') | select | list | length == 0
    fail_msg: >-
      _sshd_principals must set filename_pattern (a file name below /etc/ssh with exactly one %u and no
      other % token, no slash, no whitespace) and mappings (user name to a list of principal strings,
      at least one user)
    quiet: true
  when:
    - _sshd_principals | length > 0
  tags:
    - always
