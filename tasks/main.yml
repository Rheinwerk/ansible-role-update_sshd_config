---

- name: Configure SSH principals
  when: _sshd_principals | length > 0
  block:
    - name: Create Authorized Principals Files
      ansible.builtin.template:
        src: "etc/ssh/authorized_principals.j2"
        dest: "/etc/ssh/{{ item.key }}_principals"
        owner: "root"
        group: "root"
        mode: "0644"
      with_dict: "{{ _sshd_principals.mappings }}"

    - name: Update sshd configuration - Authorized Principals
      ansible.builtin.lineinfile:
        path: "/etc/ssh/sshd_config"
        regexp: '^AuthorizedPrincipalsFile.*$'
        line: "AuthorizedPrincipalsFile /etc/ssh/{{ _sshd_principals.filename_pattern }}"

- name: Configure SSH KRL
  when: _sshd_krl | length > 0
  block:
    # This is done so we can be sure the file exists. If it
    # does not, SSHD will start, but reject any public key basic
    # logins, effectively locking us out.
    - name: Ensure KRL file exists
      ansible.builtin.file:
        name: "{{ _sshd_krl.filename }}"
        owner: root
        group: root
        mode: "0644"
        state: touch
        access_time: preserve
        modification_time: preserve

    - name: Update sshd configuration - Revoked Keys
      ansible.builtin.lineinfile:
        path: "/etc/ssh/sshd_config"
        regexp: '^RevokedKeys.*$'
        line: "RevokedKeys {{ _sshd_krl.filename }}"

    # skip idempotence tests
    - name: Run initial KRL update # noqa no-changed-when
      ansible.builtin.command: "{{ _sshd_krl.update_command }} {{ _sshd_krl.s3_key }} {{ _sshd_krl.filename }}"
      tags: molecule-idempotence-notest

    # A systemd timer instead of cron: the service gets systemd's PATH (cron's is /usr/bin:/bin),
    # and failed runs show up in the journal and in `systemctl --failed`.
    - name: Install KRL update service and timer
      ansible.builtin.template:
        src: "etc/systemd/system/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - ssh-krl-update.service
        - ssh-krl-update.timer

    - name: Enable and start the KRL update timer
      ansible.builtin.systemd:
        name: ssh-krl-update.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Remove the KRL update cronjob of older role versions
      ansible.builtin.cron:
        name: "Update SSH Revoked Keys"
        state: absent

- name: Start ssh service
  ansible.builtin.systemd:
    name: ssh
    state: started
