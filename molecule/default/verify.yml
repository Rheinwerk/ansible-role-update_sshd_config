---
# The principals file is rendered from the role defaults, which read the CD_ENV contract faked in
# tests/vars.yml; the KRL settings come from _sshd_krl in tests/vars.yml.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the cd-admin principals file
      ansible.builtin.slurp:
        src: /etc/ssh/cd-admin_principals
      register: verify_principals

    - name: Read the sshd configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: verify_sshd_config

    - name: The principals and the KRL settings are rendered from the variables
      ansible.builtin.assert:
        that:
          - "'cd-admin_test-molecule-aws' in principals"
          - "'cd-admin_demo-aws' in principals"
          - "'AuthorizedPrincipalsFile /etc/ssh/%u_principals' in sshd_config"
          - "'RevokedKeys /etc/ssh/revoked_keys.krl' in sshd_config"
        fail_msg: "principals: {{ principals }}"
      vars:
        principals: "{{ verify_principals.content | b64decode }}"
        sshd_config: "{{ verify_sshd_config.content | b64decode }}"

    - name: Read the state of the KRL update timer
      ansible.builtin.systemd_service:
        name: ssh-krl-update.timer
      register: verify_krl_timer

    - name: Run the KRL update service once # noqa no-changed-when
      ansible.builtin.command: systemctl start ssh-krl-update.service

    - name: Read the state of the KRL update service
      ansible.builtin.systemd_service:
        name: ssh-krl-update.service
      register: verify_krl_service

    - name: The KRL update runs from the systemd timer
      ansible.builtin.assert:
        that:
          - verify_krl_timer.status.UnitFileState == 'enabled'
          - verify_krl_timer.status.ActiveState == 'active'
          - "'/bin/echo molecule/revoked_keys.krl /etc/ssh/revoked_keys.krl' in verify_krl_service.status.ExecStart"
          - verify_krl_service.status.Result == 'success'
        fail_msg: "timer: {{ verify_krl_timer.status.UnitFileState }}/{{ verify_krl_timer.status.ActiveState }}, service: {{ verify_krl_service.status.Result }}"
