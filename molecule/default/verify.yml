---
# The principals file is rendered from the role defaults, which read the CD_ENV contract faked in
# tests/vars.yml; the KRL settings come from _sshd_krl in tests/vars.yml.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the cd-admin principals file
      ansible.builtin.slurp:
        src: /etc/ssh/cd-admin_principals
      register: verify_principals

    - name: Read the sshd configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: verify_sshd_config

    - name: The principals and the KRL settings are rendered from the variables
      ansible.builtin.assert:
        that:
          - "'cd-admin_test-molecule-aws' in principals"
          - "'cd-admin_demo-aws' in principals"
          - "'AuthorizedPrincipalsFile /etc/ssh/%u_principals' in sshd_config"
          - "'RevokedKeys /etc/ssh/revoked_keys.krl' in sshd_config"
        fail_msg: "principals: {{ principals }}"
      vars:
        principals: "{{ verify_principals.content | b64decode }}"
        sshd_config: "{{ verify_sshd_config.content | b64decode }}"

    # The update command in converge_override.yml appends one line per argument and "--" per call;
    # tests/vars.yml gives it a path and an s3_key with whitespace, %, $, a quote and a backslash.
    # Every recorded call must match, also one the hourly timer may add during the run.
    - name: Read the arguments of the initial KRL update
      ansible.builtin.slurp:
        src: /var/tmp/krl-update.args
      register: verify_krl_initial_args

    - name: Forget the arguments of the initial KRL update
      ansible.builtin.file:
        path: /var/tmp/krl-update.args
        state: absent

    - name: Read the state of the KRL update timer
      ansible.builtin.systemd_service:
        name: ssh-krl-update.timer
      register: verify_krl_timer

    - name: Run the KRL update service once # noqa no-changed-when
      ansible.builtin.command: systemctl start ssh-krl-update.service

    - name: Read the state of the KRL update service
      ansible.builtin.systemd_service:
        name: ssh-krl-update.service
      register: verify_krl_service

    - name: Read the arguments of the KRL update service
      ansible.builtin.slurp:
        src: /var/tmp/krl-update.args
      register: verify_krl_service_args

    - name: The initial run and the systemd timer pass the KRL arguments unchanged
      ansible.builtin.assert:
        that:
          - initial_args | length > 0
          - initial_args == expected_record * (initial_args | length // 3)
          - service_args | length > 0
          - service_args == expected_record * (service_args | length // 3)
          - verify_krl_timer.status.UnitFileState == 'enabled'
          - verify_krl_timer.status.ActiveState == 'active'
          - verify_krl_service.status.Result == 'success'
        fail_msg: >-
          expected {{ expected_record }} per call, initial run {{ initial_args }}, service {{ service_args }};
          timer: {{ verify_krl_timer.status.UnitFileState }}/{{ verify_krl_timer.status.ActiveState }},
          service: {{ verify_krl_service.status.Result }}
      vars:
        expected_record:
          - "{{ _sshd_krl.s3_key }}"
          - "{{ _sshd_krl.filename }}"
          - "--"
        initial_args: "{{ (verify_krl_initial_args.content | b64decode).splitlines() }}"
        service_args: "{{ (verify_krl_service_args.content | b64decode).splitlines() }}"
