---
# The principals and the KRL settings come from tests/vars.yml, which also fakes the CD_ENV contract
# the role defaults read. Its filename_pattern is not the default, so the files sshd looks for only
# exist if the role derives their path from the pattern. sshd -T prints the pattern unexpanded (sshd
# expands %u at login), so this proves the role writes where the configured pattern points, not a
# certificate login.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the effective sshd configuration # noqa no-changed-when
      ansible.builtin.command: sshd -T
      register: verify_sshd_effective

    - name: Read the principals file sshd uses for each user
      ansible.builtin.slurp:
        src: "{{ principals_file | replace('%u', item) }}"
      loop: "{{ _sshd_principals.mappings.keys() | list }}"
      register: verify_principals
      vars:
        principals_file: "{{ verify_sshd_effective.stdout_lines | select('match', 'authorizedprincipalsfile ') | first | split | last }}"

    - name: Read the sshd configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: verify_sshd_config

    - name: sshd reads the principals files the role writes, and the KRL setting is rendered
      ansible.builtin.assert:
        that:
          - principals_by_user['cd-admin'][0] == 'cd-admin_super'
          - "'cd-admin_test-molecule-aws' in principals_by_user['cd-admin']"
          - "'cd-admin_demo-aws' in principals_by_user['cd-admin']"
          - principals_by_user['deploy'] == ['deploy_super', 'deploy_aws']
          - "'RevokedKeys /etc/ssh/revoked_keys.krl' in sshd_config"
        fail_msg: "principals: {{ principals_by_user }}"
      vars:
        principals_by_user: >-
          {{ dict(verify_principals.results | map(attribute='item')
                  | zip(verify_principals.results | map(attribute='content') | map('b64decode')
                        | map('split'))) }}
        sshd_config: "{{ verify_sshd_config.content | b64decode }}"

    - name: Read the state of the KRL update timer
      ansible.builtin.systemd_service:
        name: ssh-krl-update.timer
      register: verify_krl_timer

    - name: Run the KRL update service once # noqa no-changed-when
      ansible.builtin.command: systemctl start ssh-krl-update.service

    - name: Read the state of the KRL update service
      ansible.builtin.systemd_service:
        name: ssh-krl-update.service
      register: verify_krl_service

    - name: The KRL update runs from the systemd timer
      ansible.builtin.assert:
        that:
          - verify_krl_timer.status.UnitFileState == 'enabled'
          - verify_krl_timer.status.ActiveState == 'active'
          - "'/bin/echo molecule/revoked_keys.krl /etc/ssh/revoked_keys.krl' in verify_krl_service.status.ExecStart"
          - verify_krl_service.status.Result == 'success'
        fail_msg: "timer: {{ verify_krl_timer.status.UnitFileState }}/{{ verify_krl_timer.status.ActiveState }}, service: {{ verify_krl_service.status.Result }}"
