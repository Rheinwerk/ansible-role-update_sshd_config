---
- name: Install openssh-server
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items:
    - openssh-server

# https://github.com/microsoft/WSL/issues/3621
- name: Create /run/sshd inside containers
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"
    owner: root
  when: ansible_facts['virtualization_type'] in ['docker', 'podman', 'lxc', 'containerd', 'VirtualPC']

# The cron entry of role versions up to v0.5.0; the role removes it (checked in verify.yml)
- name: Install the KRL cron entry of older role versions # noqa args[module]
  ansible.builtin.cron:
    name: "Update SSH Revoked Keys"
    job: "/bin/true"
    special_time: hourly
  tags: molecule-idempotence-notest
